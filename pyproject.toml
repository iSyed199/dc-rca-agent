[project]
name = "dc-rca-agent"
version = "0.1.0"
description = "Root Cause Analysis (RCA) Agent PoC / Prototype for the Data Commons ingestion pipeline."
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "google-cloud-logging>=3.8",
    "google-cloud-storage>=2.14",
    "google-cloud-bigquery>=3.18",
    "google-cloud-firestore>=2.14",
    "google-cloud-pubsub>=2.19"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dc_rca_agent"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
